<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bibimpress — read</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* read = 인덱스: 왼쪽 제목 목록 / 오른쪽 이미지·설명·댓글. 두 칸이 따로 스크롤 */
  main.index {
    display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
    height: calc(100vh - var(--h)); padding: 0; place-items: stretch;
    font-size: 16px;
    --h1: clamp(40px, 4.4vw, 64px); /* 왼쪽 「read」 글자 크기 */
  }
  .list, .detail { overflow-y: auto; padding: 2.4vmin; }
  .list { border-right: 1px solid var(--soy); }

  /* 워크숍 표지 인덱스 양식: 큰 제목 + 개수, 머리줄, 얇은 줄로 나뉜 행 + 작은 썸네일 */
  .list h1 { font-size: var(--h1); font-weight: 500; line-height: 1.1; margin-bottom: .3em; }
  .row {
    display: grid; grid-template-columns: 3.4em 40px minmax(0, 1fr) auto; gap: 0 12px; align-items: center;
    width: 100%; padding: 8px 0; text-align: left;
    background: none; border: 0; border-bottom: 1px solid rgba(0, 0, 0, .15);
    font: inherit; font-size: 15px; color: inherit; cursor: pointer;
  }
  .row.head { font-size: 11px; padding: 0 0 6px; border-bottom: 1px solid #000; cursor: default; }
  .row.head span:nth-child(2) { grid-column: 3; }
  .list ol { list-style: none; padding: 0; }
  .thumb { width: 40px; height: 40px; }
  .row .d { font-size: 13px; font-variant-numeric: tabular-nums; opacity: .6; }
  .row .num { font-variant-numeric: tabular-nums; }
  .list ol .row:hover { background: rgba(0, 0, 0, .04); }
  .row[aria-current="true"] { background: rgba(0, 0, 0, .07); }
  .row[aria-current="true"] .t::after { content: "  →"; }

  /* 오른쪽: 「read」 줄은 비우고, 왼쪽 머리줄 높이에서 제목 → 이미지 쭉 → 설명 → 댓글 */
  .detail { line-height: 1.7; padding-top: calc(2.4vmin + var(--h1) * 1.4); }
  .detail h1 { font-size: clamp(24px, 2.4vw, 36px); line-height: 1.25; font-variation-settings: "wdth" 110, "wght" 520; }
  .meta { margin: .3em 0 0; padding-bottom: 10px; border-bottom: 1px solid #000; font-size: 14px; opacity: .8; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); align-items: start; gap: 12px; margin: 2.4vmin 0 2em; } /* 작게, 한 줄에 여러 장 */
  .shot { background: #ECE8E2; display: grid; place-items: end start; padding: 10px 12px; font-size: 12px; color: rgba(0, 0, 0, .45); }
  .desc p + p { margin-top: .9em; }
  .desc { max-width: 38em; }

  .comments { margin-top: 2.4em; max-width: 38em; }
  .comments h2 { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .6em; }
  .comments li { list-style: none; padding: .8em 0; border-top: 1px solid rgba(43, 20, 6, .2); }
  .comments b { font-weight: 600; margin-right: .6em; }

  /* 폰: 위 목록 / 아래 상세, 페이지 전체가 스크롤 */
  @media (max-width: 720px) {
    main.index { grid-template-columns: 1fr; height: auto; }
    .list { border-right: 0; border-bottom: 1px solid var(--soy); overflow: visible; }
    .detail { overflow: visible; }
  }
</style>
</head>
<body>
  <header>
    <a class="home" href="index.html">bibimpress</a>
    <nav aria-label="메뉴">
      <a href="read.html" aria-current="page">read</a>
      <a href="work.html">work</a>
    </nav>
  </header>

  <main class="index">
    <nav class="list" aria-label="read 목록">
      <h1>read</h1>
      <div class="row head" aria-hidden="true"><span>번호</span><span>제목</span><span>같이 본 날</span></div>
      <ol id="list"></ol>
    </nav>
    <article class="detail" id="detail" aria-live="polite"></article>
  </main>

  <script>
  // 더미 데이터 — 나중에 실제 아트북·댓글로 교체
  const BOOKS = Array.from({ length: 8 }, (_, i) => ({
    title: `아트북 제목 ${String(i + 1).padStart(2, '0')}`,
    author: `작가 이름 ${i + 1}`,
    publisher: '출판사',
    year: 2020 + (i % 6),
    date: `2026.${String(3 + Math.floor(i / 2)).padStart(2, '0')}.${String(4 + (i % 4) * 7).padStart(2, '0')}`,
    color: ['#E2361B', '#3F7A35', '#F28A1E', '#6B3B1E', '#FFC62A', '#2B1406', '#A8C35A', '#8E1B1F'][i],
    // 이미지: 펼침면(3:2)·낱장(4:5)·정사각 섞어서. 실제론 { src: 'media/read/…jpg' }
    shots: [3 / 2, 4 / 5, 3 / 2, 1, 3 / 2, 4 / 5, 3 / 2, 3 / 2].slice(0, i === 0 ? 8 : 3 + (i % 3)),
    desc: [
      '이곳에 책 설명이 들어가요. 어떤 책인지, 누가 만들었는지, 왜 이 책을 같이 보게 됐는지 두세 문장으로 적어요.',
      '두 번째 문단에는 책을 펼쳤을 때 눈에 띈 판형, 종이, 제본, 타이포그래피 같은 이야기를 적어요. 더미 텍스트입니다.',
    ],
    comments: [
      { name: '멤버 1', text: '여기에 우리 댓글이 들어가요. 짧은 감상 한 줄.' },
      { name: '멤버 2', text: '판형이 마음에 들었다. 다음에 책 만들 때 참고하고 싶음.' },
      { name: '멤버 3', text: '더미 댓글입니다. 길어지면 이렇게 여러 줄로 자연스럽게 넘어가요. 길어지면 이렇게 여러 줄로 자연스럽게 넘어가요.' },
    ].slice(0, 1 + (i % 3)),
  }));
  // 예시: 존 모건 책 — 사진 8장 올린 경우
  Object.assign(BOOKS[0], { title: '존 모건 (예시)', author: 'John Morgan Studio' });

  const list = document.getElementById('list');
  const detail = document.getElementById('detail');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  list.innerHTML = BOOKS.map((b, i) => `
    <li><button class="row" type="button" data-i="${i}">
      <span class="num">${String(i + 1).padStart(3, '0')}</span>
      <span class="thumb" style="background:${b.color}"></span>
      <span class="t">${esc(b.title)}</span>
      <span class="d">${esc(b.date)}</span>
    </button></li>`).join('');

  function show(i) {
    const b = BOOKS[i];
    list.querySelectorAll('button').forEach((btn) => btn.setAttribute('aria-current', btn.dataset.i == i));
    detail.innerHTML = `
      <h1>${esc(b.title)}</h1>
      <p class="meta">${esc(b.author)} · ${esc(b.publisher)} · ${b.year} — ${esc(b.date)}에 같이 봄</p>
      <div class="shots">${b.shots.map((r, k) => `<div class="shot" style="aspect-ratio:${r}">${k + 1} / ${b.shots.length}</div>`).join('')}</div>
      <div class="desc">${b.desc.map((p) => `<p>${esc(p)}</p>`).join('')}</div>
      <section class="comments">
        <h2>댓글 ${b.comments.length}</h2>
        <ul>${b.comments.map((c) => `<li><b>${esc(c.name)}</b>${esc(c.text)}</li>`).join('')}</ul>
      </section>`;
    detail.scrollTop = 0;
    history.replaceState(null, '', `#${i + 1}`); // 주소로 공유 가능 (#3 = 3번째 책)
  }

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    show(+btn.dataset.i);
    if (matchMedia('(max-width: 720px)').matches) detail.scrollIntoView({ behavior: 'smooth' });
  });
  const fromHash = parseInt(location.hash.slice(1), 10) - 1;
  show(BOOKS[fromHash] ? fromHash : 0);
  </script>
</body>
</html>
