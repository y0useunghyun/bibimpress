<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bibimpress — read</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* read = 인덱스: 왼쪽 제목 목록 / 오른쪽 이미지·설명·댓글. 두 칸이 따로 스크롤 */
  main.index {
    display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
    height: calc(100vh - var(--h)); padding: 0; place-items: stretch;
    font-size: 16px;
    --h1: clamp(40px, 4.4vw, 64px); /* 왼쪽 「read」 글자 크기 */
  }
  .list, .detail { overflow-y: auto; padding: 2.4vmin; }
  .list { border-right: 1px solid var(--soy); }

  /* 워크숍 표지 인덱스 양식: 큰 제목 + 개수, 머리줄, 얇은 줄로 나뉜 행 + 작은 썸네일 */
  .list h1 { font-size: var(--h1); font-weight: 500; line-height: 1.1; margin-bottom: .3em; }
  .row {
    display: grid; grid-template-columns: 3.4em 40px minmax(0, 1fr) auto; gap: 0 12px; align-items: center;
    width: 100%; padding: 8px 0; text-align: left;
    background: none; border: 0; border-bottom: 1px solid rgba(0, 0, 0, .15);
    font: inherit; font-size: 15px; color: inherit; cursor: pointer;
  }
  .row.head { font-size: 11px; padding: 0 0 6px; border-bottom: 1px solid #000; cursor: default; }
  .row.head span:nth-child(2) { grid-column: 3; }
  .list ol { list-style: none; padding: 0; }
  .thumb { width: 40px; height: 40px; }
  .row .d { font-size: 13px; font-variant-numeric: tabular-nums; opacity: .6; }
  .row .num { font-variant-numeric: tabular-nums; }
  .list ol .row:hover { background: rgba(0, 0, 0, .04); }
  .row[aria-current="true"] { background: rgba(0, 0, 0, .07); }
  .row[aria-current="true"] .t::after { content: "  →"; }

  /* 오른쪽: 「read」 줄은 비우고, 왼쪽 머리줄 높이에서 제목 → 이미지 쭉 → 설명 → 댓글 */
  .detail { line-height: 1.7; padding-top: calc(2.4vmin + var(--h1) * 1.4); }
  .detail h1 { font-size: clamp(24px, 2.4vw, 36px); line-height: 1.25; font-variation-settings: "wdth" 110, "wght" 520; }
  .meta { margin: .3em 0 0; padding-bottom: 10px; border-bottom: 1px solid #000; font-size: 14px; opacity: .8; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); align-items: start; gap: 12px; margin: 2.4vmin 0 2em; } /* 작게, 한 줄에 여러 장 */
  .shot { background: #ECE8E2; display: grid; place-items: end start; padding: 10px 12px; font-size: 12px; color: rgba(0, 0, 0, .55); text-decoration: none; line-height: 1.35; }
  a.shot:hover { background: #E2DDD5; color: #000; }
  .pic { color: inherit; text-decoration: none; font-size: 12px; line-height: 1.35; }
  .pic.wide { grid-column: span 2; }
  .meta a { color: inherit; }
  .pic img { display: block; width: 100%; object-fit: cover; background: #ECE8E2; margin-bottom: 6px; }
  .pic:hover span { text-decoration: underline; }
  /* 설명·댓글 — 폭 좁게, 촘촘하게 */
  .desc { max-width: 30em; font-size: 15px; line-height: 1.6; word-break: keep-all; }
  .desc p + p { margin-top: .6em; }

  .comments { margin-top: 1.6em; max-width: 30em; font-size: 14px; line-height: 1.5; word-break: keep-all; }
  .comments h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .3em; }
  .comments ul { padding: 0; }
  .comments li { list-style: none; padding: .45em 0; border-top: 1px solid rgba(43, 20, 6, .2); }
  .comments b { font-weight: 600; margin-right: .6em; }

  /* 폰: 위 목록 / 아래 상세, 페이지 전체가 스크롤 */
  @media (max-width: 720px) {
    main.index { grid-template-columns: 1fr; height: auto; }
    .list { border-right: 0; border-bottom: 1px solid var(--soy); overflow: visible; }
    .detail { overflow: visible; }
  }
</style>

      '글자체를 만들고 파는 활자 주조소이자, 한정판 책과 아트 에디션을 내는 출판사.',
      '「Revue」에는 레터링과 타이포그래피 역사를 다룬 글을 싣는다. 아래 칸은 Revue 글과 카탈로그(글자체·책) — 이미지는 사이트에서 그대로 불러옴.',
    ],
    shots: [{ img: 'media/read/abyme.jpg', ratio: 16 / 10, wide: true, caption: 'abyme.net 첫 화면', href: 'https://www.abyme.net/' }].concat([{"caption": "Revue — Essential forms, a survey of lettering standards", "href": "https://www.abyme.net/revue/essentialforms/", "img": "https://www.abyme.net/wp-content/uploads/2024/10/A046_chouffet-2400x1726.jpg"}, {"caption": "Revue — The first sanserif type (James Mosley)", "href": "https://www.abyme.net/revue/thefirstsanseriftype/", "img": "https://www.abyme.net/wp-content/uploads/2023/11/A045_blake_1819c-2400x1584.jpg"}, {"caption": "Revue — Paul Elliman, YES, NO, DON’T KNOW", "href": "https://www.abyme.net/revue/yes-no-dont-know/", "img": "https://www.abyme.net/wp-content/uploads/2017/12/yesno_spirit_6_60p-2400x1602.jpg"}, {"caption": "Revue — HMS Victory, a voyage in photographs", "href": "https://www.abyme.net/revue/victory/", "img": "https://www.abyme.net/wp-content/uploads/2016/11/victory6_60p-2400x1560.jpg"}, {"caption": "Revue — Abîmées, typefaces for Latin epigraphy", "href": "https://www.abyme.net/revue/abimees/", "img": "https://www.abyme.net/wp-content/uploads/2021/06/A033_4_simil.jpg"}, {"caption": "Revue — Carolee Schneemann, ABC We Print Anything", "href": "https://www.abyme.net/revue/tenderbooks/", "img": "https://www.abyme.net/wp-content/uploads/2018/07/JMS-Tenderbooks-4839-1_web-2400x1800.jpg"}, {"caption": "Revue — Berthe Morisot, Le Berceau", "href": "https://www.abyme.net/revue/berthe/", "img": "https://www.abyme.net/wp-content/uploads/2018/07/cradle_1600_60p.jpg"}, {"caption": "Axo (15 styles)", "href": "https://www.abyme.net/catalogue/axo/", "img": "https://www.abyme.net/wp-content/uploads/2024/03/A035_3c.png"}, {"caption": "Persona (3 styles)", "href": "https://www.abyme.net/catalogue/persona/", "img": "https://www.abyme.net/wp-content/uploads/2022/06/A013_3.png"}, {"caption": "Mercure (3 styles)", "href": "https://www.abyme.net/catalogue/mercure/", "img": "https://www.abyme.net/wp-content/uploads/2021/05/A024_21.png"}, {"caption": "Berthe (2 styles)", "href": "https://www.abyme.net/catalogue/berthe/", "img": "https://www.abyme.net/wp-content/uploads/2018/07/berthe_2_12-2400x960.png"}, {"caption": "Nizioleti", "href": "https://www.abyme.net/catalogue/nizioleti/", "img": "https://www.abyme.net/wp-content/uploads/2019/11/nizioleti_amour.png"}, {"caption": "English Egyptian", "href": "https://www.abyme.net/catalogue/englishegyptian/", "img": "https://www.abyme.net/wp-content/uploads/2023/07/A002.png"}, {"caption": "Sweathearts typeface", "href": "https://www.abyme.net/catalogue/sweathearts/", "img": "https://www.abyme.net/wp-content/uploads/2022/11/A022_11b.png"}, {"caption": "Anguille — Christophe Jacquet dit Toffe", "href": "https://www.abyme.net/catalogue/anguille/", "img": "https://www.abyme.net/wp-content/uploads/2023/03/A007_hokusai.jpg"}, {"caption": "Sweathearts (book)", "href": "https://www.abyme.net/catalogue/sweatheartsbook/", "img": "https://www.abyme.net/wp-content/uploads/2024/02/A043_2d.jpg"}, {"caption": "Margaret — Thomas Grünfeld", "href": "https://www.abyme.net/catalogue/margaret/"}, {"caption": "ABC We Print Anything — Carolee Schneemann", "href": "https://www.abyme.net/catalogue/abc/", "img": "https://www.abyme.net/wp-content/uploads/2017/12/abc4.jpg"}, {"caption": "YES, NO, DON’T KNOW — Paul Elliman", "href": "https://www.abyme.net/catalogue/yesno/", "img": "https://www.abyme.net/wp-content/uploads/2017/12/yesno_1_60p-1-2400x1606.jpg"}].map((s) => ({ ratio: 4 / 5, ...s }))),
  });

  const list = document.getElementById('list');
  const detail = document.getElementById('detail');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  list.innerHTML = BOOKS.map((b, i) => `
    <li><button class="row" type="button" data-i="${i}">
      <span class="num">${String(i + 1).padStart(3, '0')}</span>
      <span class="thumb" style="background:${b.color}"></span>
      <span class="t">${esc(b.title)}</span>
      <span class="d">${esc(b.date)}</span>
    </button></li>`).join('');

  function show(i) {
    const b = BOOKS[i];
    list.querySelectorAll('button').forEach((btn) => btn.setAttribute('aria-current', btn.dataset.i == i));
    detail.innerHTML = `
      <h1>${esc(b.title)}</h1>
      <p class="meta">${[b.author, b.publisher, b.year].filter(Boolean).map(esc).join(' · ')} — ${esc(b.date)}에 같이 봄${b.site ? ` · <a href="${esc(b.site)}" target="_blank" rel="noopener">사이트 ↗</a>` : ''}</p>
      <div class="shots">${b.shots.map((sh, k) => {
        const { ratio, caption, href, img, wide } = typeof sh === 'number' ? { ratio: sh } : sh;
        const label = caption ? esc(caption) : `${k + 1} / ${b.shots.length}`;
        if (img) return `<a class="pic${wide ? ' wide' : ''}" href="${esc(href)}" target="_blank" rel="noopener">
          <img src="${esc(img)}" alt="${label}" loading="lazy" style="aspect-ratio:${ratio || 4 / 5}"><span>${label}</span></a>`;
        return href
          ? `<a class="shot" href="${esc(href)}" target="_blank" rel="noopener" style="aspect-ratio:${ratio}">${label}</a>`
          : `<div class="shot" style="aspect-ratio:${ratio}">${label}</div>`;
      }).join('')}</div>
      <div class="desc">${b.desc.map((p) => `<p>${esc(p)}</p>`).join('')}</div>
      <section class="comments">
        <h2>댓글 ${b.comments.length}</h2>
        <ul>${b.comments.map((c) => `<li><b>${esc(c.name)}</b>${esc(c.text)}</li>`).join('')}</ul>
      </section>`;
    detail.scrollTop = 0;
    history.replaceState(null, '', `#${i + 1}`); // 주소로 공유 가능 (#3 = 3번째 책)
  }

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    show(+btn.dataset.i);
    if (matchMedia('(max-width: 720px)').matches) detail.scrollIntoView({ behavior: 'smooth' });
  });
  const fromHash = parseInt(location.hash.slice(1), 10) - 1;
  show(BOOKS[fromHash] ? fromHash : 0);
  </script>
</body>
</html>
